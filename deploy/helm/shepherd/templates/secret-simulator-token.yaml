{{- /*
  The simulator's bearer token (W4-S3, D9's precedence case 3): the fallback
  once simulator.token.existingSecret is unset and externalSecrets.enabled is
  false. shepherd.simulatorTokenSecretName (_helpers.tpl) is what both
  Deployments actually read from; this file only decides what VALUE lands in
  the Secret it names.

  Regenerating a random value on every render would roll both Deployments
  (their checksum/simulator-token annotation) on every single `helm upgrade`
  even though nothing about the token needed to change -- annoying churn, not
  a security problem, but needless. So: `lookup` the live Secret and reuse its
  value when one already exists; generate a fresh `randAlphaNum` only when
  there is truly nothing to reuse. `simulator.token.value` overrides both, for
  callers that need a known, stable value (e.g. a fixture-driven kind/compose
  parity check).

  Same lookup-fails-open caveat as cnpg-cluster.yaml and externalsecret.yaml:
  under Argo CD, Flux or `helm template | kubectl apply` there is no live
  cluster to look up against, so this Secret's value regenerates on every
  sync and both Deployments roll every time. Set simulator.token.value or
  simulator.token.existingSecret to avoid that under those tools.
*/}}
{{- if and ((.Values.simulator).enabled) (not ((.Values.simulator.token).existingSecret)) (not ((.Values.externalSecrets).enabled)) }}
{{- $secretName := include "shepherd.simulatorTokenSecretName" . }}
{{- $key := include "shepherd.simulatorTokenKey" . }}
{{- $value := (.Values.simulator.token).value }}
{{- if not $value }}
{{- $existingData := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
{{- if hasKey $existingData $key }}
{{- $value = b64dec (index $existingData $key) }}
{{- else }}
{{- $value = randAlphaNum 40 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "shepherd.simulatorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $value | quote }}
{{- end }}
