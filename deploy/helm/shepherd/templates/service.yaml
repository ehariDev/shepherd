apiVersion: v1
kind: Service
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ include "shepherd.appPortName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ include "shepherd.appPortName" . }}
      protocol: TCP
      {{- /*
        h2c is a cleartext-HTTP/2 hint and cannot apply once TLS is on, so
        "https" always wins over service.appProtocol here -- unlike
        config.server.listen (see values.yaml's tls block comment), there is
        no scenario where an operator-set appProtocol should survive TLS
        being enabled.
      */}}
      {{- if (.Values.tls).enabled }}
      appProtocol: https
      {{- else if .Values.service.appProtocol }}
      appProtocol: {{ .Values.service.appProtocol }}
      {{- end }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "shepherd.selectorLabels" . | nindent 4 }}
