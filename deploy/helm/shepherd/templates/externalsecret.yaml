{{- if ((.Values.externalSecrets).enabled) }}
{{- if .Values.secrets }}
{{- fail "externalSecrets.enabled and `secrets` both set: they would render two different definitions of the same Secret. Pick one -- let the operator generate the bootstrap values, or supply them yourself." }}
{{- end }}
{{- if .Values.existingSecret }}
{{- fail "externalSecrets.enabled and existingSecret both set: the ExternalSecret would generate a Secret that nothing reads. Pick one." }}
{{- end }}
{{- /*
  The generated Secret carries the encryption key and the bootstrap password --
  never a database URL. So something else has to supply one, and if nothing
  does, the migration Job starts with SHEPHERD_DATABASE_URL simply absent
  (envFrom is optional: true) and fails on connect until backoffLimit kills the
  release several minutes later, with nothing pointing at the cause.
*/}}
{{- if not (or ((.Values.cnpg).enabled) .Values.extraEnv) }}
{{- fail "externalSecrets.enabled needs a database URL from somewhere: set cnpg.enabled=true to have one provisioned, or supply SHEPHERD_DATABASE_URL through extraEnv. The generated secret holds the encryption key and admin password only." }}
{{- end }}
{{- $fullName := include "shepherd.fullname" . }}
{{- /*
  Render ONLY when the ExternalSecret does not already exist -- the same guard,
  and for the same reason, as cnpg-cluster.yaml.

  refreshInterval "0" and deletionPolicy Retain protect the generated key only
  while this object survives. They do nothing if Helm DELETES and RECREATES it,
  which is exactly what the default before-hook-creation policy does on every
  upgrade: the fresh ExternalSecret performs its one sync against fresh Password
  generators and overwrites the encryption key that cannot be rotated.

  Skipping the render leaves the live ExternalSecret, its generators and the
  Secret it owns completely untouched.
*/}}
{{- /*
  externalSecrets.render, for the same reason and with the same three values as
  cnpg.render -- see the long note in cnpg-cluster.yaml. lookup fails open under
  Argo CD, Flux and `helm template | kubectl apply`, and there the failure is
  the one this guard exists to prevent: the ExternalSecret is recreated on every
  sync, syncs once against fresh Password generators, and replaces an encryption
  key that cannot be rotated. Set `never` once the secret exists.
*/}}
{{- $render := .Values.externalSecrets.render | default "auto" }}
{{- if not (has $render (list "auto" "always" "never")) }}
{{- fail (printf "externalSecrets.render must be one of auto, always, never (got %q)" $render) }}
{{- end }}
{{- $existingBootstrap := "" }}
{{- if eq $render "auto" }}
{{- $existingBootstrap = lookup .Values.externalSecrets.apiVersion "ExternalSecret" .Release.Namespace (printf "%s-bootstrap" $fullName) }}
{{- end }}
{{- if and (ne $render "never") (not $existingBootstrap) }}
apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $fullName }}-encryption-key
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  # No symbols: the value is base64-encoded into Shepherd's 32-byte key, so
  # the alphabet only has to be 32 bytes wide, not memorable.
  length: {{ .Values.externalSecrets.encryptionKey.length }}
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
---
apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $fullName }}-admin-password
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  length: {{ .Values.externalSecrets.bootstrapAdmin.length }}
  digits: 5
  symbols: 5
  symbolCharacters: "-_@%+"
  noUpper: false
  allowRepeat: true
{{- end }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-bootstrap
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  # "0" means generate once and never again. This is not a rotatable
  # credential: a new encryption key cannot decrypt the git credentials and
  # OIDC client secret the old one wrote, and nothing would report the loss at
  # the moment it happened.
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  target:
    # The name the Deployment and the migration Job already read.
    name: {{ $fullName }}-secrets
    creationPolicy: Owner
    # Retain, for the same reason refreshInterval is 0: deleting this
    # ExternalSecret must not take the encryption key with it.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Shepherd wants base64 of 32 bytes; the generator produces 32
        # characters, so the encoding happens here.
        SHEPHERD_SECURITY_ENCRYPTION_KEY: "{{ `{{ .encryptionKey | b64enc }}` }}"
        {{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
        SHEPHERD_BOOTSTRAP_ADMIN_LOGIN: {{ .Values.externalSecrets.bootstrapAdmin.login | quote }}
        SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD: "{{ `{{ .adminPassword }}` }}"
        {{- end }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
          kind: Password
          name: {{ $fullName }}-encryption-key
      rewrite:
        - regexp:
            source: "password"
            target: "encryptionKey"
    {{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
          kind: Password
          name: {{ $fullName }}-admin-password
      rewrite:
        - regexp:
            source: "password"
            target: "adminPassword"
    {{- end }}
{{- end }}
{{- /*
  The simulator's bearer token (W4-S3, D9's precedence case 2): generated the
  same way the bootstrap values above are -- a Password generator ESO
  resolves once and writes into a Secret, never a value this chart computes
  or sees. Deliberately independent of the $render/$existingBootstrap decision
  above: simulator.enabled and externalSecrets.enabled are orthogonal
  switches, so this has to be able to render (or skip, or stop re-rendering
  once it exists) without disturbing the bootstrap Secret's own render-once
  guard, or vice versa.

  simulator.token.existingSecret still wins over this even with
  externalSecrets.enabled -- D9's precedence is fixed, not "whichever was set
  last".
*/}}
{{- if and ((.Values.simulator).enabled) (not ((.Values.simulator.token).existingSecret)) }}
{{- $simSecretName := include "shepherd.simulatorTokenSecretName" . }}
{{- $simRender := .Values.externalSecrets.render | default "auto" }}
{{- $existingSimToken := "" }}
{{- if eq $simRender "auto" }}
{{- $existingSimToken = lookup .Values.externalSecrets.apiVersion "ExternalSecret" .Release.Namespace $simSecretName }}
{{- end }}
{{- if and (ne $simRender "never") (not $existingSimToken) }}
---
apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $simSecretName }}
  labels:
    {{- include "shepherd.simulatorLabels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  length: 40
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $simSecretName }}
  labels:
    {{- include "shepherd.simulatorLabels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  # Same "0" reasoning as the bootstrap ExternalSecret above: this is not
  # meant to rotate silently underneath a running control API.
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  target:
    # The name shepherd.simulatorTokenSecretName resolves for BOTH
    # Deployments -- see the long comment on that helper in _helpers.tpl.
    name: {{ $simSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # A plain bearer token, unlike the encryption key above -- no
        # b64enc, internal/simsvc.Config.Token reads it as literal text.
        {{ include "shepherd.simulatorTokenKey" . }}: "{{ `{{ .token }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
          kind: Password
          name: {{ $simSecretName }}
      rewrite:
        - regexp:
            source: "password"
            target: "token"
{{- end }}
{{- end }}
{{- end }}
